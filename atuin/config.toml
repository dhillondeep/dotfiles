auto_sync = true
sync_frequency = "10m"
update_check = false
style = "compact"
inline_height = 18
enter_accept = false
keymap_mode = "auto"
show_preview = true
show_tabs = false
filter_mode = "global"
search_mode = "daemon-fuzzy"
workspaces = true

# The daemon keeps the search index hot and moves history writes off the
# interactive path, which keeps Ctrl-R fast once history gets large. autostart
# lets atuin manage the process itself, so this needs no systemd --user unit.
[daemon]
enabled = true
autostart = true

[stats]
common_subcommands = [
  "apt",
  "brew",
  "cargo",
  "docker",
  "git",
  "go",
  "kubectl",
  "npm",
  "uv",
]
